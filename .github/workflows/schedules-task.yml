name: checkin-task

on:
  workflow_dispatch:
  schedule:
    # 定时北京时间凌晨1点执行，转换UTC时间 -8小时
    - cron: 10 17 * * *

jobs:
  checkin-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run main
        env:
        # 注册环境变量
          GLADOS: ${{ secrets.GLADOS }}
