name: checkin-task

on:
  workflow_dispatch:
  schedule:
    # 定时北京时间凌晨1点10执行，转换UTC时间 -8小时
    # 整点由于免费可能排队人多，任务执行延迟个7、8小时都正常，非整点试一下
    - cron: 10 17 * * *

jobs:
  checkin-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run main
        env:
        # 注册环境变量
          GLADOS: ${{ secrets.GLADOS }}
